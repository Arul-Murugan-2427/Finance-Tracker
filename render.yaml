services:
  - type: web
    name: rupeetrack-backend
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: rupeetrack-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: FROM_EMAIL
        value: "RupeeTrack Support <no-reply@rupeetrack.com>"

databases:
  - name: rupeetrack-db
    plan: free
    databaseName: rupeetrack_db
    user: rupeetrack
